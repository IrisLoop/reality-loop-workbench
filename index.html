<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F4F2EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Reality Loop</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app">

  <!-- ═════════════════════════════════
       PAGE: Dashboard (Home)
       ═════════════════════════════════ -->
  <div class="page active" id="page-dashboard">
    <!-- Dashboard Home -->
    <div id="dash-home" class="page-content"></div>

    <!-- Sub-pages -->
    <div id="dash-tasks-page" class="page-content hidden"></div>
    <div id="dash-ai-page" class="page-content hidden"></div>
    <div id="dash-english-page" class="page-content hidden"></div>
    <div id="dash-fatloss-page" class="page-content hidden"></div>
    <div id="dash-finance-page" class="page-content hidden"></div>
    <div id="dash-settings-page" class="page-content hidden"></div>
  </div>

  <!-- ═════════════════════════════════
       PAGE: Chats
       ═════════════════════════════════ -->
  <div class="page" id="page-chats">
    <div id="chats-list-view" class="page-content"></div>
    <div id="chats-detail-view" class="page-content hidden"></div>
  </div>

  <!-- ═════════════════════════════════
       PAGE: Diary
       ═════════════════════════════════ -->
  <div class="page" id="page-diary">
    <div id="diary-list-view" class="page-content"></div>
    <div id="diary-editor-view" class="page-content hidden"></div>
  </div>

  <!-- ═════════════════════════════════
       Bottom Navigation
       ═════════════════════════════════ -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-page="dashboard">Home</button>
    <button class="nav-item" data-page="chats">Chats</button>
    <button class="nav-item" data-page="diary">Diary</button>
  </nav>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p class="confirm-msg" id="confirm-msg"></p>
    <div class="confirm-actions">
      <button class="btn btn-outline btn-sm" id="confirm-cancel">取消</button>
      <button class="btn btn-primary btn-sm" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/weather.js"></script>
<script src="js/chat-provider.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/tasks.js"></script>
<script src="js/ai-learning.js"></script>
<script src="js/english.js"></script>
<script src="js/fatloss.js"></script>
<script src="js/finance.js"></script>
<script src="js/diary.js"></script>
<script src="js/chats.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
