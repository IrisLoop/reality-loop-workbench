name: Update daily digests and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '7,37 6 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Force replacement of an existing current-day snapshot
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build previous-day AI Hot digest
        env:
          AI_HOT_SKIP_IF_CURRENT: ${{ inputs.force_refresh && '0' || '1' }}
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-ai-news.mjs

      - name: Build previous-day finance digest
        id: finance_digest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FINANCE_NEWS_SKIP_IF_CURRENT: ${{ inputs.force_refresh && '0' || '1' }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINANCE_NEWS_DEEPSEEK_API_KEY: ${{ secrets.FINANCE_NEWS_DEEPSEEK_API_KEY }}
        run: node scripts/update-finance-news.mjs

      - name: Report finance digest failure
        if: steps.finance_digest.outcome == 'failure'
        shell: bash
        run: echo "Finance digest update failed; keeping the last successful snapshot."

      - name: Persist scheduled snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet -- data/ai-news.json data/finance-news.json; then
            echo "Daily snapshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-news.json data/finance-news.json
          git commit -m "chore: update daily learning digests"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
